<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1334" viewBox="0 0 1660 1334" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#808080"/></marker></defs><rect width="1660" height="1334" fill="#ffffff"/><text x="20" y="28" font-size="21" font-weight="bold" fill="#222">Cloud: provider Control Plane and Data Plane in the cloud</text><g transform="translate(0,40)"><rect x="20" y="40" width="270" height="450" rx="8" fill="#e4f4e6" stroke="#666" stroke-width="1.5"/><text x="34" y="70" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="34" dy="0">Test controller</tspan></text><text x="34" y="423" font-size="13" text-anchor="start" fill="#333"><tspan x="34" dy="0">MacBook Air, Apple silicon, macOS</tspan><tspan x="34" dy="17">Tailscale client</tspan><tspan x="34" dy="17">runs the test scripts; no data</tspan><tspan x="34" dy="17">passes through it</tspan></text><rect x="60" y="150" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="165.0" y="178.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="165.0" dy="0" font-weight="bold">test scripts</tspan><tspan x="165.0" dy="17">catalog request,</tspan><tspan x="165.0" dy="17">negotiation</tspan></text><rect x="60" y="300" width="210" height="92" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="165.0" y="325.5" font-size="13.5" text-anchor="middle" fill="#888"><tspan x="165.0" dy="0">ssh :22 to all servers</tspan><tspan x="165.0" dy="17">deploy, start pull client,</tspan><tspan x="165.0" dy="17">docker stats, clock offsets</tspan><tspan x="165.0" dy="17">(not timed)</tspan></text><path d="M235,230 L235,300" fill="none" stroke="#808080" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ag)"/><rect x="440" y="40" width="300" height="840" rx="8" fill="#eeeeee" stroke="#666" stroke-width="1.5"/><text x="454" y="70" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="454" dy="0">Consumer: Contabo VPS</tspan></text><text x="454" y="813" font-size="13" text-anchor="start" fill="#333"><tspan x="454" dy="0">4 vCPU AMD EPYC, 8 GB RAM</tspan><tspan x="454" dy="17">Ubuntu 24.04.4, Docker 29.5.3</tspan><tspan x="454" dy="17">database sync write 0.5 ms</tspan><tspan x="454" dy="17">also hosts the TwinFlow app</tspan></text><rect x="480" y="150" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="585.0" y="178.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="585.0" dy="0" font-weight="bold">consumer-cp</tspan><tspan x="585.0" dy="17">Control Plane</tspan><tspan x="585.0" dy="17">mgmt :9192 · DSP :9193</tspan></text><line x1="532" y1="230" x2="532" y2="255" stroke="#777" stroke-width="1.2"/><path d="M480,263 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M480,263 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="532.0" y="283" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="532.0" dy="0">consumer-cp-db</tspan><tspan x="532.0" dy="14">PostgreSQL 16</tspan></text><rect x="480" y="370" width="210" height="70" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="585.0" y="393.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="585.0" dy="0" font-weight="bold">pull-client.py</tspan><tspan x="585.0" dy="17">transfer and fetches</tspan><tspan x="585.0" dy="17">(started over ssh)</tspan></text><rect x="480" y="540" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="585.0" y="559.5" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="585.0" dy="0" font-weight="bold">consumer-dp</tspan><tspan x="585.0" dy="17">Data Plane</tspan><tspan x="585.0" dy="17">pull proxy :9296</tspan><tspan x="585.0" dy="17">signaling :9295</tspan></text><line x1="532" y1="620" x2="532" y2="645" stroke="#777" stroke-width="1.2"/><path d="M480,653 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M480,653 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="532.0" y="673" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="532.0" dy="0">consumer-dp-db</tspan><tspan x="532.0" dy="14">PostgreSQL 16</tspan></text><rect x="480" y="718" width="210" height="50" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="585.0" y="739.5" font-size="13.5" text-anchor="middle" fill="#888"><tspan x="585.0" dy="0">data-receiver :4000</tspan><tspan x="585.0" dy="17">push tests only</tspan></text><rect x="900" y="40" width="310" height="840" rx="8" fill="#dcecff" stroke="#666" stroke-width="1.5"/><text x="914" y="70" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="914" dy="0">cPouta: CSC cloud VM</tspan></text><text x="914" y="796" font-size="13" text-anchor="start" fill="#333"><tspan x="914" dy="0">KVM VM (CSC cPouta)</tspan><tspan x="914" dy="17">4 vCPU Xeon (Cascade Lake)</tspan><tspan x="914" dy="17">8 GB RAM, Ubuntu 24.04.5</tspan><tspan x="914" dy="17">Docker 29.8.2</tspan><tspan x="914" dy="17">database sync write 1.7 ms</tspan></text><rect x="940" y="150" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="1045.0" y="169.5" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1045.0" dy="0" font-weight="bold">provider-cp</tspan><tspan x="1045.0" dy="17">Control Plane</tspan><tspan x="1045.0" dy="17">mgmt :8182 · DSP :8183</tspan><tspan x="1045.0" dy="17">control :8185</tspan></text><line x1="992" y1="230" x2="992" y2="255" stroke="#777" stroke-width="1.2"/><path d="M940,263 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M940,263 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="992.0" y="283" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="992.0" dy="0">provider-cp-db</tspan><tspan x="992.0" dy="14">PostgreSQL 16</tspan></text><rect x="940" y="540" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="1045.0" y="559.5" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1045.0" dy="0" font-weight="bold">provider-dp</tspan><tspan x="1045.0" dy="17">Data Plane</tspan><tspan x="1045.0" dy="17">public :8284</tspan><tspan x="1045.0" dy="17">signaling :8285</tspan></text><line x1="992" y1="620" x2="992" y2="645" stroke="#777" stroke-width="1.2"/><path d="M940,653 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M940,653 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="992.0" y="673" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="992.0" dy="0">provider-dp-db</tspan><tspan x="992.0" dy="14">PostgreSQL 16</tspan></text><rect x="1380" y="480" width="260" height="400" rx="8" fill="#eee6f8" stroke="#666" stroke-width="1.5"/><text x="1394" y="510" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="1394" dy="0">TAU VM 2: data source</tspan></text><text x="1394" y="813" font-size="13" text-anchor="start" fill="#333"><tspan x="1394" dy="0">bhyve VM, same subnet as VM 1</tspan><tspan x="1394" dy="17">2 vCPU Xeon Gold 6130, 8 GB RAM</tspan><tspan x="1394" dy="17">Ubuntu 24.04.4, Docker 29.8.2</tspan><tspan x="1394" dy="17">database sync write ~26 ms</tspan></text><rect x="1420" y="540" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="1525.0" y="576.5" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1525.0" dy="0" font-weight="bold">data-simulator :5050</tspan><tspan x="1525.0" dy="17">TC1 to TC3 payloads</tspan></text><rect x="1420" y="660" width="210" height="80" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1525.0" y="688.0" font-size="13.5" text-anchor="middle" fill="#888"><tspan x="1525.0" dy="0">basyx-aas :8091</tspan><tspan x="1525.0" dy="17">MongoDB, crane-adapter</tspan><tspan x="1525.0" dy="17">TC4 only</tspan></text><path d="M270,190 L480,190" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="365.0" y="166" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="365.0" dy="0" font-weight="bold">(1) HTTP :9192</tspan><tspan x="365.0" dy="16">RTT mean 66 ms</tspan></text><path d="M690,190 L940,190" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-start="url(#ab)" marker-end="url(#ab)"/><text x="820.0" y="166" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="820.0" dy="0" font-weight="bold">(2) DSP :8183</tspan><tspan x="820.0" dy="16">RTT 46 ms</tspan></text><path d="M690,580 L940,580" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="820.0" y="556" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="820.0" dy="0" font-weight="bold">(7) HTTP :8284</tspan><tspan x="820.0" dy="16">RTT 46 ms</tspan></text><path d="M1150,580 L1420,580" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="1295.0" y="556" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1295.0" dy="0" font-weight="bold">(8) HTTP :5050</tspan><tspan x="1295.0" dy="16">RTT 8 ms</tspan></text><path d="M655,370 L655,230" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="647" y="338" font-size="13.5" text-anchor="end" fill="#222"><tspan x="647" dy="0" font-weight="bold">(4) HTTP :9192</tspan><tspan x="647" dy="16">same host</tspan></text><path d="M540,440 L540,540" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="550" y="482" font-size="13.5" text-anchor="start" fill="#222"><tspan x="550" dy="0" font-weight="bold">(5) HTTP :9296</tspan><tspan x="550" dy="16">same host</tspan></text><path d="M690,555 L718,555 L718,215 L690,215" fill="none" stroke="#1f4e79" stroke-width="2.2" marker-end="url(#ab)"/><text x="750" y="385" font-size="13.5" text-anchor="start" fill="#222"><tspan x="750" dy="0" font-weight="bold">(6) HTTP :9192</tspan><tspan x="750" dy="16">same host,</tspan><tspan x="750" dy="16">first fetch only</tspan></text><path d="M1115,230 L1115,540" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="1107" y="385" font-size="13.5" text-anchor="end" fill="#222"><tspan x="1107" dy="0" font-weight="bold">(3) HTTP :8285</tspan><tspan x="1107" dy="16">same host</tspan></text><path d="M1150,602 L1420,700" fill="none" stroke="#808080" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ag)"/><text x="1295.0" y="705" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1295.0" dy="0">TC4 only</tspan><tspan x="1295.0" dy="16">HTTP :8091</tspan></text><rect x="20" y="910" width="1620" height="344" rx="6" fill="#ffffff" stroke="#999" stroke-width="1"/><text x="40" y="938" font-size="15" text-anchor="start" fill="#222" font-weight="bold"><tspan x="40" dy="0">Communication tested (thick arrows are on the timed path)</tspan></text><text x="40" y="966" font-size="14" text-anchor="start" fill="#222"><tspan x="40" dy="0">(1) catalog and negotiation requests, from the test controller to the consumer Control Plane (management API)</tspan><tspan x="40" dy="22">(2) DSP between the Control Planes: catalog, negotiation, transfer request and start</tspan><tspan x="40" dy="22">(3) the provider Control Plane tells its Data Plane to start the flow; the Data Plane returns endpoint and token</tspan><tspan x="40" dy="22">(4) the pull client starts the transfer and polls the consumer Control Plane for the token</tspan><tspan x="40" dy="22">(5) the pull client asks the consumer Data Plane for the data of the transfer, without a token (repeated)</tspan><tspan x="40" dy="22">(6) the consumer Data Plane reads endpoint and token from its Control Plane (first fetch of a transfer only)</tspan><tspan x="40" dy="22">(7) the consumer Data Plane fetches the data from the provider Data Plane, with the token</tspan><tspan x="40" dy="22">(8) the provider Data Plane fetches the payload from the data source</tspan><tspan x="40" dy="22">Phases: catalog (1)(2) · negotiation (1)(2) · transfer setup (4)(2)(3)(2) · fetch (5)(7)(8), first fetch also (6)</tspan></text><text x="40" y="1180" font-size="14" text-anchor="start" fill="#222"><tspan x="40" dy="0">RTT: ping round trip between the servers at the start of the run (13 October 2026); (1): mean of 10 pings from the controller.</tspan><tspan x="40" dy="22">Thin lines: database connection (JDBC :5432); every connector unit has its own PostgreSQL 16 (0.5 CPU, 256 MB).</tspan></text><text x="1000" y="938" font-size="15" text-anchor="start" fill="#222" font-weight="bold"><tspan x="1000" dy="0">Notes</tspan></text><text x="1000" y="966" font-size="14" text-anchor="start" fill="#222"><tspan x="1000" dy="0">Dotted: not timed (ssh from the controller; TC4 reads</tspan><tspan x="1000" dy="22">the alert through the AAS instead of the simulator).</tspan><tspan x="1000" dy="22">Greyed: deployed, but not used by the pull tests.</tspan><tspan x="1000" dy="22">Data path: source, provider Data Plane, consumer</tspan><tspan x="1000" dy="22">Data Plane, pull client. The client never holds the token.</tspan><tspan x="1000" dy="22">All traffic between servers goes over the</tspan><tspan x="1000" dy="22">Tailscale (WireGuard) overlay network.</tspan><tspan x="1000" dy="22">Connector containers: EDC 0.14.1, 4 CPU / 4 GB each.</tspan><tspan x="1000" dy="22">Database sync write: time of one synchronous disk</tspan><tspan x="1000" dy="22">write, measured with pg_test_fsync (8 October 2026).</tspan></text></g></svg>
