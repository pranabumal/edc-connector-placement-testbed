<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1302" viewBox="0 0 1660 1302" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4e79"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#808080"/></marker></defs><rect width="1660" height="1302" fill="#ffffff"/><text x="20" y="28" font-size="21" font-weight="bold" fill="#222">Hybrid: provider Control Plane in the cloud, Data Plane on the edge server (push)</text><g transform="translate(0,40)"><rect x="20" y="40" width="270" height="450" rx="8" fill="#e4f4e6" stroke="#666" stroke-width="1.5"/><text x="34" y="70" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="34" dy="0">Test controller</tspan></text><text x="34" y="423" font-size="13" text-anchor="start" fill="#333"><tspan x="34" dy="0">MacBook Air, Apple silicon, macOS</tspan><tspan x="34" dy="17">Tailscale client</tspan><tspan x="34" dy="17">starts and observes the run; no</tspan><tspan x="34" dy="17">timed step or data passes through it</tspan></text><rect x="60" y="150" width="210" height="110" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="165.0" y="176.0" font-size="13.5" text-anchor="middle" fill="#888"><tspan x="165.0" dy="0">ssh :22 to all servers</tspan><tspan x="165.0" dy="17">deploy, start the application,</tspan><tspan x="165.0" dy="17">collect its results,</tspan><tspan x="165.0" dy="17">docker stats, clock offsets</tspan><tspan x="165.0" dy="17">(not timed)</tspan></text><rect x="440" y="40" width="300" height="840" rx="8" fill="#eeeeee" stroke="#666" stroke-width="1.5"/><text x="454" y="70" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="454" dy="0">Consumer: Contabo VPS</tspan></text><text x="454" y="813" font-size="13" text-anchor="start" fill="#333"><tspan x="454" dy="0">4 vCPU AMD EPYC, 8 GB RAM</tspan><tspan x="454" dy="17">Ubuntu 24.04.4, Docker 29.5.3</tspan><tspan x="454" dy="17">database sync write 0.5 ms</tspan><tspan x="454" dy="17">also hosts the TwinFlow app</tspan></text><rect x="480" y="150" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="585.0" y="178.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="585.0" dy="0" font-weight="bold">consumer-cp</tspan><tspan x="585.0" dy="17">Control Plane</tspan><tspan x="585.0" dy="17">mgmt :9192 · DSP :9193</tspan></text><line x1="532" y1="230" x2="532" y2="255" stroke="#777" stroke-width="1.2"/><path d="M480,263 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M480,263 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="532.0" y="283" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="532.0" dy="0">consumer-cp-db</tspan><tspan x="532.0" dy="14">PostgreSQL 16</tspan></text><rect x="466" y="372" width="238" height="282" rx="8" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="7 4"/><rect x="480" y="388" width="210" height="76" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="585.0" y="414.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="585.0" dy="0" font-weight="bold">consumer application</tspan><tspan x="585.0" dy="17">test-case scripts: catalog,</tspan><tspan x="585.0" dy="17">negotiation, transfer requests</tspan></text><rect x="480" y="540" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="585.0" y="568.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="585.0" dy="0" font-weight="bold">data-receiver :4000</tspan><tspan x="585.0" dy="17">ingestion endpoint,</tspan><tspan x="585.0" dy="17">logs every arrival</tspan></text><text x="585.0" y="642" font-size="12.5" text-anchor="middle" fill="#333"><tspan x="585.0" dy="0">Consumer data platform, simulated</tspan></text><text x="585.0" y="500" font-size="12.5" text-anchor="middle" fill="#555"><tspan x="585.0" dy="0">stands for a digital twin</tspan><tspan x="585.0" dy="15">platform or an ERP</tspan></text><rect x="480" y="672" width="210" height="62" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="585.0" y="691.0" font-size="13.5" text-anchor="middle" fill="#888"><tspan x="585.0" dy="0">consumer-dp + own database</tspan><tspan x="585.0" dy="17">Data Plane, deployed;</tspan><tspan x="585.0" dy="17">not used in a push</tspan></text><rect x="900" y="40" width="310" height="400" rx="8" fill="#dcecff" stroke="#666" stroke-width="1.5"/><text x="914" y="70" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="914" dy="0">cPouta: CSC cloud VM</tspan></text><text x="914" y="356" font-size="13" text-anchor="start" fill="#333"><tspan x="914" dy="0">KVM VM (CSC cPouta)</tspan><tspan x="914" dy="17">4 vCPU Xeon (Cascade Lake)</tspan><tspan x="914" dy="17">8 GB RAM, Ubuntu 24.04.5</tspan><tspan x="914" dy="17">Docker 29.8.2</tspan><tspan x="914" dy="17">database sync write 1.7 ms</tspan></text><rect x="900" y="480" width="310" height="400" rx="8" fill="#fff4d6" stroke="#666" stroke-width="1.5"/><text x="914" y="510" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="914" dy="0">TAU VM 1: edge server</tspan></text><text x="914" y="813" font-size="13" text-anchor="start" fill="#333"><tspan x="914" dy="0">bhyve VM on SmartOS/Triton</tspan><tspan x="914" dy="17">4 vCPU Xeon Gold 6130, 8 GB RAM</tspan><tspan x="914" dy="17">Ubuntu 24.04.4, Docker 29.8.2</tspan><tspan x="914" dy="17">database sync write ~100 ms</tspan></text><rect x="940" y="150" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="1045.0" y="169.5" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1045.0" dy="0" font-weight="bold">provider-cp</tspan><tspan x="1045.0" dy="17">Control Plane</tspan><tspan x="1045.0" dy="17">mgmt :8182 · DSP :8183</tspan><tspan x="1045.0" dy="17">control :8185</tspan></text><line x1="992" y1="230" x2="992" y2="255" stroke="#777" stroke-width="1.2"/><path d="M940,263 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M940,263 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="992.0" y="283" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="992.0" dy="0">provider-cp-db</tspan><tspan x="992.0" dy="14">PostgreSQL 16</tspan></text><rect x="940" y="540" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="1045.0" y="568.0" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1045.0" dy="0" font-weight="bold">provider-dp</tspan><tspan x="1045.0" dy="17">Data Plane</tspan><tspan x="1045.0" dy="17">signaling :8285</tspan></text><line x1="992" y1="620" x2="992" y2="645" stroke="#777" stroke-width="1.2"/><path d="M940,653 a52.0,8 0 0 1 104,0 v42 a52.0,8 0 0 1 -104,0 z" fill="#fafafa" stroke="#777" stroke-width="1.2"/><path d="M940,653 a52.0,8 0 0 0 104,0" fill="none" stroke="#777" stroke-width="1.2"/><text x="992.0" y="673" font-size="11.5" text-anchor="middle" fill="#222"><tspan x="992.0" dy="0">provider-dp-db</tspan><tspan x="992.0" dy="14">PostgreSQL 16</tspan></text><rect x="1380" y="480" width="260" height="400" rx="8" fill="#eee6f8" stroke="#666" stroke-width="1.5"/><text x="1394" y="510" font-size="17" text-anchor="start" fill="#222" font-weight="bold"><tspan x="1394" dy="0">TAU VM 2: data source</tspan></text><text x="1394" y="813" font-size="13" text-anchor="start" fill="#333"><tspan x="1394" dy="0">bhyve VM, same subnet as VM 1</tspan><tspan x="1394" dy="17">2 vCPU Xeon Gold 6130, 8 GB RAM</tspan><tspan x="1394" dy="17">Ubuntu 24.04.4, Docker 29.8.2</tspan><tspan x="1394" dy="17">database sync write ~26 ms</tspan></text><rect x="1420" y="540" width="210" height="80" rx="6" fill="#ffffff" stroke="#555" stroke-width="1.5"/><text x="1525.0" y="576.5" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1525.0" dy="0" font-weight="bold">data-simulator :5050</tspan><tspan x="1525.0" dy="17">TC1 to TC3 payloads</tspan></text><rect x="1420" y="660" width="210" height="80" rx="6" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.5" stroke-dasharray="5 4"/><text x="1525.0" y="688.0" font-size="13.5" text-anchor="middle" fill="#888"><tspan x="1525.0" dy="0">basyx-aas :8091</tspan><tspan x="1525.0" dy="17">MongoDB, crane-adapter</tspan><tspan x="1525.0" dy="17">TC4 only</tspan></text><path d="M270,190 L440,190" fill="none" stroke="#808080" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ag)"/><text x="365.0" y="166" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="365.0" dy="0">ssh :22</tspan><tspan x="365.0" dy="16">not timed</tspan></text><path d="M655,388 L655,230" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="647" y="338" font-size="13.5" text-anchor="end" fill="#222"><tspan x="647" dy="0" font-weight="bold">(1) HTTP :9192</tspan><tspan x="647" dy="16">same host</tspan></text><path d="M690,190 L940,190" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-start="url(#ab)" marker-end="url(#ab)"/><text x="820.0" y="166" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="820.0" dy="0" font-weight="bold">(2) DSP :8183</tspan><tspan x="820.0" dy="16">RTT 48 ms</tspan></text><path d="M1115,230 L1115,540" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="1123" y="458" font-size="13.5" text-anchor="start" fill="#222"><tspan x="1123" dy="0" font-weight="bold">(3) HTTP :8285</tspan><tspan x="1123" dy="16">RTT 8 ms, WAN</tspan></text><path d="M1150,580 L1420,580" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="1295.0" y="556" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1295.0" dy="0" font-weight="bold">(4) HTTP GET :5050</tspan><tspan x="1295.0" dy="16">RTT 3 ms</tspan></text><path d="M940,580 L690,580" fill="none" stroke="#1f4e79" stroke-width="3.5" marker-end="url(#ab)"/><text x="820.0" y="556" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="820.0" dy="0" font-weight="bold">(5) HTTP POST :4000</tspan><tspan x="820.0" dy="16">RTT 42 ms</tspan></text><path d="M1150,602 L1420,700" fill="none" stroke="#808080" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ag)"/><text x="1295.0" y="705" font-size="13.5" text-anchor="middle" fill="#222"><tspan x="1295.0" dy="0">TC4 only</tspan><tspan x="1295.0" dy="16">HTTP :8091</tspan></text><rect x="20" y="910" width="1620" height="312" rx="6" fill="#ffffff" stroke="#999" stroke-width="1"/><text x="40" y="938" font-size="15" text-anchor="start" fill="#222" font-weight="bold"><tspan x="40" dy="0">Communication tested (thick arrows are on the timed path)</tspan></text><text x="40" y="966" font-size="14" text-anchor="start" fill="#222"><tspan x="40" dy="0">(1) catalog, negotiation and transfer requests, from the consumer application to its Control Plane (management API)</tspan><tspan x="40" dy="22">(2) DSP between the Control Planes: catalog, negotiation, transfer request and start</tspan><tspan x="40" dy="22">(3) the provider Control Plane tells its Data Plane to start the flow</tspan><tspan x="40" dy="22">(4) the provider Data Plane fetches the payload from the data source</tspan><tspan x="40" dy="22">(5) the provider Data Plane pushes the payload to the destination the application named: its ingestion endpoint</tspan><tspan x="40" dy="22">Phases: catalog (1)(2) · negotiation (1)(2) · one transfer, request to received (2)(3)(4)(5)</tspan></text><text x="40" y="1114" font-size="14" text-anchor="start" fill="#222"><tspan x="40" dy="0">A transfer is timed from its creation on the consumer Control Plane to its arrival at the receiver, on one clock.</tspan><tspan x="40" dy="22">Catalog and negotiation are timed by the consumer application, on the same server. The test controller is in no timed step.</tspan><tspan x="40" dy="22">RTT: ping round trip between the servers at the start of the run.</tspan><tspan x="40" dy="22">Thin lines: database connection (JDBC :5432); every connector unit has its own PostgreSQL 16 (0.5 CPU, 256 MB).</tspan></text><text x="1000" y="938" font-size="15" text-anchor="start" fill="#222" font-weight="bold"><tspan x="1000" dy="0">Notes</tspan></text><text x="1000" y="966" font-size="14" text-anchor="start" fill="#222"><tspan x="1000" dy="0">Stock EDC 0.14.1, transfer type HttpData-PUSH.</tspan><tspan x="1000" dy="22">Data path: source, provider Data Plane, ingestion</tspan><tspan x="1000" dy="22">endpoint. The address of that endpoint travels in</tspan><tspan x="1000" dy="22">each transfer request; nothing is registered before.</tspan><tspan x="1000" dy="22">Greyed: deployed, but not used. The consumer Data</tspan><tspan x="1000" dy="22">Plane carries no data in stock EDC.</tspan><tspan x="1000" dy="22">Dotted: not timed (ssh from the controller; TC4 reads</tspan><tspan x="1000" dy="22">the alert through the AAS instead of the simulator).</tspan><tspan x="1000" dy="22">All traffic between servers goes over the</tspan><tspan x="1000" dy="22">Tailscale (WireGuard) overlay network.</tspan><tspan x="1000" dy="22">Connector containers: EDC 0.14.1, 4 CPU / 4 GB each.</tspan></text></g></svg>
