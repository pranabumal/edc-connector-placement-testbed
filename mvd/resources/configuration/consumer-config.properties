# ── Participant Identity ──────────────────────────────────────────────────────
edc.participant.id=consumer

# ── HTTP API Endpoints ────────────────────────────────────────────────────────
# Health / default
web.http.port=9191
web.http.path=/api

# Management API
web.http.management.port=9192
web.http.management.path=/management

# DSP Protocol endpoint
web.http.protocol.port=9193
web.http.protocol.path=/protocol

# Data Plane public endpoint
web.http.public.port=9194
web.http.public.path=/public

# Control signaling
web.http.control.port=9195
web.http.control.path=/control

# ── DSP Callback ──────────────────────────────────────────────────────────────
edc.dsp.callback.address=http://consumer:9193/protocol

# ── Data Plane Configuration ──────────────────────────────────────────────────
edc.dataplane.api.public.baseurl=http://consumer:9194/public/
edc.dpf.selector.url=http://consumer:9195/control/v1/dataplanes

# ── IAM (mock) ────────────────────────────────────────────────────────────────
edc.iam.issuer.id=did:web:consumer
