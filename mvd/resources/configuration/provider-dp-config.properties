# Must be the Docker service name — see provider-cp-config.properties for why.
edc.hostname=provider-dp

# ── HTTP API Endpoints ────────────────────────────────────────────────────────
# Health / default
web.http.port=8281
web.http.path=/api

# Data Plane public endpoint (consumer pulls data from here, if PULL is used)
web.http.public.port=8284
web.http.public.path=/public

# Control context — serves the data-plane-signaling API; provider-cp's
# ManualDataPlaneRegistrationExtension calls into this over the Docker network
web.http.control.port=8285
web.http.control.path=/control

# ── Data Plane Configuration ──────────────────────────────────────────────────
edc.dataplane.api.public.baseurl=http://provider-dp:8284/public/

# Access tokens for PULL transfers: vault aliases of the key pair the Data
# Plane signs and verifies them with (DataPlaneTokenKeysExtension generates it)
edc.transfer.proxy.token.signer.privatekey.alias=dataplane-token-private-key
edc.transfer.proxy.token.verifier.publickey.alias=dataplane-token-public-key

# ── Persistence — this unit's own Postgres (provider-dp-db) ───────────────────────
# Defaults target the single-machine compose. Distributed deployments override
# via environment variables (EDC maps EDC_DATASOURCE_DEFAULT_URL → the key
# below); the password is never stored here — it comes from
# EDC_DATASOURCE_DEFAULT_PASSWORD.
edc.datasource.default.url=jdbc:postgresql://provider-dp-db:5432/provider_dp
edc.datasource.default.user=edc
edc.sql.schema.autocreate=true
