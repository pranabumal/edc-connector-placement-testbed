# ── Participant Identity ──────────────────────────────────────────────────────
edc.participant.id=provider

# Must be the Docker service name — CP and DP are separate containers now, so
# any auto-derived callback URL (e.g. ControlApiUrl) needs to resolve to this
# container over the Docker network, not "localhost" (the property's default).
edc.hostname=provider-cp

# ── HTTP API Endpoints ────────────────────────────────────────────────────────
# Health / default
web.http.port=8181
web.http.path=/api

# Management API  (curl targets this for asset/policy/contract management)
web.http.management.port=8182
web.http.management.path=/management

# DSP Protocol endpoint (connector-to-connector negotiation)
web.http.protocol.port=8183
web.http.protocol.path=/protocol

# Control context — internal only, nothing calls into it (data-plane-signaling
# is served by provider-dp, not this runtime)
web.http.control.port=8185
web.http.control.path=/control

# ── DSP Callback ──────────────────────────────────────────────────────────────
# Must be reachable by the consumer's Control Plane (Docker service name)
edc.dsp.callback.address=http://provider-cp:8183/protocol

# ── Remote Data Plane Registration ─────────────────────────────────────────────
# provider-dp is a separate process/container; see
# ManualDataPlaneRegistrationExtension (mvd/cp-runtime) for why this can't use
# EDC's built-in self-registration extension across a real process split.
edc.dataplane.remote.control.url=http://provider-dp:8285/control
edc.dataplane.remote.id=provider-dataplane

# ── IAM (mock — no real identity provider for test environment) ───────────────
edc.iam.issuer.id=did:web:provider

# ── Persistence — this unit's own Postgres (provider-cp-db) ───────────────────────
# Defaults target the single-machine compose. Distributed deployments override
# via environment variables (EDC maps EDC_DATASOURCE_DEFAULT_URL → the key
# below); the password is never stored here — it comes from
# EDC_DATASOURCE_DEFAULT_PASSWORD.
edc.datasource.default.url=jdbc:postgresql://provider-cp-db:5432/provider_cp
edc.datasource.default.user=edc
edc.sql.schema.autocreate=true
