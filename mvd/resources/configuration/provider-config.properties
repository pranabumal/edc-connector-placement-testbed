# ── Participant Identity ──────────────────────────────────────────────────────
edc.participant.id=provider

# ── HTTP API Endpoints ────────────────────────────────────────────────────────
# Health / default
web.http.port=8181
web.http.path=/api

# Management API  (curl targets this for asset/policy/contract management)
web.http.management.port=8182
web.http.management.path=/management

# DSP Protocol endpoint (connector-to-connector negotiation)
web.http.protocol.port=8183
web.http.protocol.path=/protocol

# Data Plane public endpoint (consumer pulls data from here)
web.http.public.port=8184
web.http.public.path=/public

# Control signaling (control plane ↔ data plane internal channel)
web.http.control.port=8185
web.http.control.path=/control

# ── DSP Callback ──────────────────────────────────────────────────────────────
# Must be reachable by the consumer connector (Docker service name)
edc.dsp.callback.address=http://provider:8183/protocol

# ── Data Plane Configuration ──────────────────────────────────────────────────
edc.dataplane.api.public.baseurl=http://provider:8184/public/
edc.dpf.selector.url=http://provider:8185/control/v1/dataplanes

# ── IAM (mock — no real identity provider for test environment) ───────────────
edc.iam.issuer.id=did:web:provider
